name: Bulk checks

# Tests the Bulk patches on the Bulk line: the patch inventory, the npm
# package's type check and build, its bulk-tests (with the TypeScript 7 scale
# tests at 2,621 and 4,021 modules) and the runtime's function spec paging in
# system-udfs. Runs on pull requests to main, on main, and from
# bulk_upstream_sync.yml on a commit with an upstream merge applied. See
# BULK_FORK.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test.
        type: string
        required: true
      merge_upstream:
        description: Upstream commit to merge into `ref` before testing.
        type: string
        default: ""

concurrency:
  # A called workflow shares the caller's concurrency, so only pull requests
  # cancel older runs.
  group:
    ${{ github.event_name == 'pull_request' && format('bulk-checks-{0}',
    github.event.pull_request.number) || format('bulk-checks-{0}',
    github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  npm:
    name: Bulk patches (npm package and system UDFs)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          # The inventory diffs against the newest merged upstream commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: npm-packages/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The npm package build runs `uv run --script scripts/build.py`.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Fetch upstream main
        run:
          git fetch --no-tags https://github.com/convex/convex-backend.git
          +refs/heads/main:refs/remotes/upstream/main

      - name: Merge upstream
        if: inputs.merge_upstream != ''
        env:
          TARGET: ${{ inputs.merge_upstream }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node bulk/upstream.mjs merge --target "$TARGET" --require-clean

      - name: Patch inventory
        run: |
          set -euo pipefail
          {
            echo '```'
            node bulk/upstream.mjs status
            echo '```'
            node bulk/upstream.mjs inventory --markdown
          } >> "$GITHUB_STEP_SUMMARY"
          node bulk/upstream.mjs inventory --check > /dev/null

      - name: Install dependencies
        working-directory: npm-packages
        run:
          pnpm install --frozen-lockfile --filter "convex..." --filter
          "system-udfs..."

      - name: Type check
        working-directory: npm-packages/convex
        run: pnpm run typecheck

      # system-udfs tests import the built `convex` package.
      - name: Build the npm package
        working-directory: npm-packages/convex
        run: npm run build

      # The scale tests type-check with typescript@7.0.2 through npx, as Bulk
      # does; the package's own TypeScript 5.0 does not show the cliff.
      - name: Test Bulk npm patches
        working-directory: npm-packages/convex
        run: pnpm exec vitest run bulk-tests

      - name: Test the function spec pages
        working-directory: npm-packages/system-udfs
        run: pnpm exec vitest run convex/_system/cli

      - name: No conflict markers or whitespace errors from upstream merges
        run: git diff --check "$(git merge-base HEAD upstream/main)" HEAD
