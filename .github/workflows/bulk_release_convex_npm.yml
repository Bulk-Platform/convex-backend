name: Release Bulk Convex npm package

# Publishes npm-packages/convex as @bulk-platform/convex to GitHub Packages.
# Push a tag `convex-npm/v<upstream version>-bulk.<n>` on the bulk/convex-npm
# branch, for example `convex-npm/v1.46.0-bulk.1`. See npm-packages/convex/BULK.md.
on:
  push:
    tags:
      - "convex-npm/v*"

concurrency:
  group: bulk-convex-npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test and publish @bulk-platform/convex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: npm-packages/convex

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: npm-packages/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@bulk-platform"

      # `npm pack` runs the package build, `uv run --script scripts/build.py`
      # since upstream 1.48.0.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Read release version from tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#convex-npm/v}"
          upstream="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^${upstream//./\\.}-bulk\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME must be convex-npm/v${upstream}-bulk.<n>" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: npm-packages
        run: pnpm install --frozen-lockfile --filter "convex..."

      - name: Type check
        run: pnpm run typecheck

      # The scale tests type-check with typescript@7.0.2 through npx, as Bulk
      # does; the package's own TypeScript 5.0 does not show the cliff.
      - name: Test Bulk patches
        run: pnpm exec vitest run bulk-tests

      - name: Pack
        run: |
          set -euo pipefail
          # GitHub Packages links the package to the repository named here.
          npm pkg set name=@bulk-platform/convex version="$VERSION" \
            publishConfig.registry=https://npm.pkg.github.com \
            repository.url=git+https://github.com/Bulk-Platform/convex-backend.git
          npm pack
          ls -l ./*.tgz

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # npm 11 refuses prerelease versions without an explicit dist-tag.
        # Every release of this package is `<upstream>-bulk.<n>`.
        run: npm publish --tag latest "./bulk-platform-convex-${VERSION}.tgz"
